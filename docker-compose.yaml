version: "3.8"

services:
  trading-bot:
    build: .
    env_file: .env
    environment:
      - TRADING_LOG_LEVEL=INFO
      - TRADING_RUN_MODE=paper
    volumes:
      - ./data:/app/data
      - ./trading_bot/config:/app/trading_bot/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import trading_bot"]
      interval: 60s
      timeout: 10s
      retries: 3
