[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c \"python -m trading_bot.api.keys issue --tier free --label railway-smoke-test --manifest-path /tmp/api_keys_manifest.jsonl && uvicorn trading_bot.api.server:app --host 0.0.0.0 --port 8080\""
healthcheckPath = "/health"
healthcheckTimeout = 5
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
