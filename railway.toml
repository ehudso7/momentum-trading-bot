[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT and routes the healthcheck to it. Both entry
# points (trading-bot-api and the core bot dashboard) read $PORT
# (fail-soft default 8080) and expose GET /health.
#
# scripts/railway_start.sh picks what to run from SERVICE_ROLE:
#   api (default) — SaaS analytics + billing API
#   bot           — core trading loop + live dashboard
# It also chmods /app/data because a Railway volume may be remounted
# root-owned at runtime.
startCommand = "/bin/sh /app/scripts/railway_start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
