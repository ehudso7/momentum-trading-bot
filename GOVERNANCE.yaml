# GOVERNANCE.yaml — project governance manifest for Momentum Trading Bot
# Generated by `ehgov init` from ehudso7/project-governance; the pinned release
# is `governance.version` below (the single source of truth for this pin).
# This file is project-owned after generation: edit deliberately and keep it
# valid (`ehgov validate`). To adopt a new governance release, update
# `governance.version` and then run `ehgov sync` to refresh managed sections.
governance:
  source: ehudso7/project-governance
  version: 1.2.1
  schema_version: 1
  profile: regulated-system
project:
  id: momentum-trading-bot
  name: Momentum Trading Bot
  type: ai-agent-system
  criticality: critical
  lifecycle: active
agents:
  claude_code: true
  codex: false
  human_approval_required_for:
    - production-deployment
    - destructive-migration
    - secrets
    - billing
    - authentication
    - authorization
graphs:
  default:
    feature: feature-development
    bug: bug-resolution
    architecture: architecture-review
    release: production-release
    incident: incident-response
    audit: repository-audit
    security: security-review
    diligence: acquisition-diligence
    dependency: dependency-upgrade
policies:
  required:
    - base
    - security
    - delivery
    - ai-agents
evidence:
  output_directory: .governance/evidence
  retain_days: 365
  require_execution_record: true
sensitive_paths:
  - ".github/workflows/**"
  - "**/migrations/**"
  - "infra/**"
  - "**/*auth*"
  - "**/*billing*"
  - "**/*permission*"
  - "**/*secret*"
sync:
  managed_files:
    - CLAUDE.md
    - AGENTS.md
    - PROJECT.md
    - GRAPH.md
    - EVIDENCE.md
    - DECISIONS.md
