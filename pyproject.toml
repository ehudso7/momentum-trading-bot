[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-trading-bot"
version = "1.0.0"
description = "Automated momentum day-trading bot for US equities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ehudso7"}]
keywords = ["trading", "momentum", "day-trading", "stocks", "alpaca", "vwap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "alpaca-py>=0.21",
    "polygon-api-client>=1.14",
    "yfinance>=0.2.36",
    "structlog>=24.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "pytz>=2024.1",
    "python-dotenv>=1.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/ehudso7/momentum-trading-bot"
Repository = "https://github.com/ehudso7/momentum-trading-bot"
Issues = "https://github.com/ehudso7/momentum-trading-bot/issues"

[project.optional-dependencies]
backtest = [
    "vectorbt>=0.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "freezegun>=1.3",
    "httpx>=0.27",
]

[project.scripts]
trading-bot = "trading_bot.main:main"

[tool.setuptools.packages.find]
include = ["trading_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["trading_bot"]
omit = ["tests/*"]
