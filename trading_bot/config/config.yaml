# Momentum Day-Trading Bot Configuration
# ========================================
# WARNING: This is high-risk software. Most traders lose money.
# Backtest results do NOT guarantee live performance.
# Start with paper trading only.
# ========================================

run_mode: "paper"          # backtest | paper | live
starting_capital: 100000.0
log_level: "INFO"
log_json: false
journal_csv_path: "data/journal.csv"

# Backtest settings (only used in backtest mode)
backtest_start_date: "2024-01-01"
backtest_end_date: "2025-01-01"
backtest_symbols:
  - "TSLA"
  - "NVDA"
  - "AMD"
  - "PLTR"

# Scanner: Pre-market & intraday momentum gapper filters
# Note: Scan interval is ADAPTIVE based on time of day (10s–60s).
# The value below is used only outside market hours.
scanner:
  min_gap_pct: 4.0           # Minimum gap-up percentage
  max_gap_pct: 200.0         # Avoid >200% extended runners
  max_float_shares: 50000000 # 50M shares max float
  ideal_float_shares: 20000000
  min_relative_volume: 2.0   # 2x average volume minimum
  min_price: 2.0             # No pennystocks
  max_price: 50.0            # Includes mid-cap momentum
  scan_interval_seconds: 60  # Base interval (adaptive overrides during market hours)
  max_candidates: 20
  catalyst_keywords:
    - "FDA"
    - "earnings"
    - "contract"
    - "acquisition"
    - "merger"
    - "offering"
    - "buyback"
    - "upgrade"
    - "partnership"
    - "approval"
    - "trial"
    - "revenue"
    - "guidance"
    - "squeeze"

# Risk management - NON-NEGOTIABLE safety parameters
risk:
  risk_per_trade_pct: 1.0        # Risk 1% of equity per trade
  max_daily_risk_pct: 3.0        # Max 3% total daily risk
  max_open_positions: 4          # Max 4 concurrent positions
  max_leverage: 4.0              # Max 4x effective leverage
  pdt_equity_threshold: 25000.0  # PDT rule threshold
  stop_loss_atr_multiplier: 1.25 # Stop = entry - 1.25*ATR
  drawdown_circuit_breaker_pct: 5.0  # Halt at 5% daily drawdown
  max_consecutive_losses: 5      # Halt after 5 consecutive losses
  hard_daily_loss_limit_pct: 5.0 # Hard stop at 5% daily loss
  api_error_halt_threshold: 5    # Halt after 5 API errors

# Entry signal parameters
entry:
  vwap_proximity_pct: 1.5       # Within 1.5% of VWAP for pullback
  ema_period: 9                  # EMA period for pullback
  volume_confirmation_multiplier: 1.5  # Volume must be 1.5x recent avg
  min_atr_distance: 0.5         # Min stop distance in ATR units
  breakout_lookback_bars: 5     # Bars to check for breakout
  min_consolidation_bars: 3     # Min bars of consolidation

# Exit and profit-taking
exit:
  scale_out_ratios:              # How to divide position exits
    - 0.25                       # 25% at first target
    - 0.25                       # 25% at second target
    - 0.25                       # 25% at third target
    - 0.25                       # remainder trailed
  scale_out_rr_targets:          # R:R targets for scale-outs
    - 1.0                        # First exit at 1:1 risk/reward
    - 2.0                        # Second exit at 2:1 risk/reward
    - 3.0                        # Third exit at 3:1 risk/reward
  trailing_stop_atr_multiplier: 1.5
  trailing_stop_breakeven_buffer_pct: 0.5
  hard_time_exit: "15:50"       # Flat by 3:50 PM ET
  use_parabolic_sar: true

# Broker settings (Alpaca)
broker:
  alpaca_paper: true             # ALWAYS start with paper trading
  # API keys should be in .env file, not here

# Data provider settings
data:
  use_polygon_news: true
  float_cache_hours: 24
  # API keys should be in .env file, not here
